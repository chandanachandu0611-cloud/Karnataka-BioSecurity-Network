<script>
async function analyzeImageWithGemma(input) {
    if (input.files && input.files[0]) {
        const formData = new FormData();
        formData.append('image', input.files[0]);

        const statusEl = document.getElementById('aistatus');
        const titleInput = document.getElementById('issue_title');
        const symptomsInput = document.getElementById('symptoms');
        const descInput = document.getElementById('description');
        const animalSelect = document.getElementById('animal_type');

        // Show loading state
        statusEl.innerHTML = '<i class="fas fa-spinner fa-spin text-primary"></i> 🤖 Gemma AI Analyzing Image... Please wait.';

        try {
            const response = await fetch('/api/analyze_image', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();
            console.log("Gemma Response Data:", data); // Debug Log

            if (data.success) {
                // Populate text fields
                if (data.title) titleInput.value = data.title;
                if (data.symptoms) symptomsInput.value = data.symptoms;
                if (data.description) descInput.value = data.description;

                // Smart Animal Dropdown Selection
                if (data.animal_type) {
                    const aiAnimal = String(data.animal_type).toLowerCase();
                    console.log("Detected AI Animal:", aiAnimal);

                    if (aiAnimal.includes('cow') || aiAnimal.includes('cattle') || aiAnimal.includes('bovine')) {
                        animalSelect.value = 'Cattle';
                    } else if (aiAnimal.includes('poultry') || aiAnimal.includes('chicken') || aiAnimal.includes('bird')) {
                        animalSelect.value = 'Poultry';
                    } else if (aiAnimal.includes('goat') || aiAnimal.includes('sheep')) {
                        animalSelect.value = 'Goat/Sheep';
                    } else if (aiAnimal.includes('pig') || aiAnimal.includes('swine')) {
                        animalSelect.value = 'Pig';
                    } else {
                        animalSelect.value = data.animal_type;
                    }
                }

                // Set Severity Radio Button
                if (data.severity) {
                    const sev = String(data.severity).toLowerCase();
                    if (sev.includes('low')) {
                        document.getElementById('sev_low').checked = true;
                    } else if (sev.includes('high')) {
                        document.getElementById('sev_high').checked = true;
                    } else {
                        document.getElementById('sev_med').checked = true;
                    }
                }

                statusEl.innerHTML = '<i class="fas fa-check-circle text-success"></i> Auto-filled by Gemma AI!';
            } else {
                statusEl.innerHTML = '<i class="fas fa-exclamation-circle text-danger"></i> Failed to analyze image.';
            }
        } catch (error) {
            console.error("Error connecting to Gemma API:", error);
            statusEl.innerHTML = '<i class="fas fa-exclamation-triangle text-warning"></i> Error analyzing image.';
        }
    }
}
</script>
